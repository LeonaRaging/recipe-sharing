services:
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_sharing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_sharing"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDRESS: "0.0.0.0:8080"
      DATABASE_URL: "host=db user=postgres password=postgres dbname=recipe_sharing port=5432 sslmode=disable"
      JWT_KEY: ${JWT_KEY?Please configure JWT_KEY in the .env file.}
    depends_on:
      db:
        condition: service_healthy
  
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    environment:
      BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    command: run /scripts/api.js
volumes:
  postgres_data: